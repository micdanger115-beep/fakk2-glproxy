; Einstellungen fuer die Proxy-opengl32.dll. Liegt neben fakk2.exe.
; Fehlt die Datei, gelten die Standardwerte unten.

[log]
; Alle N Frames eine Zeile mit Durchschnittswerten pro Frame (0 = aus).
summary_interval=300

; Taste fuer ein Frame-Capture (Virtual-Key-Code, dezimal). 122 = F11, 0 = aus.
; Beim Druecken wird der naechste Frame komplett mit allen Aufrufen geloggt.
capture_key=122

; Automatisch Frame N mitschneiden (0 = aus). Praktisch fuer Vergleiche.
capture_frame=0

; Im Capture auch jeden glVertex*/glArrayElement-Aufruf loggen (sehr viel Text).
capture_vertices=0

; Alle wglGetProcAddress-Anfragen loggen (zeigt, welche Extensions das Spiel nutzt).
log_extensions=1
